[versions]
spotless-plugin = "8.10.1"
gradle-version-plugin = "0.53.0"
javalin-lib = "7.2.2"
slf4j-simple-lib = "2.0.7"
shadow-plugin = "8.3.11"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }
versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-version-plugin"}
shadow = { id = "com.gradleup.shadow", version.ref = "shadow-plugin"}

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin-lib"}
slf4j-simple = {module = "org.slf4j:slf4j-simple", version.ref = "slf4j-simple-lib"}